tasks.named('test') {
    inputs.files(configurations.wheelFixture)
    systemProperty 'worklist.wheelFixture', configurations.wheelFixture.singleFile.absolutePath
    systemProperty 'worklist.testClasspath', sourceSets.test.runtimeClasspath.asPath
    // The integration fixtures use isolated Forge classloaders; keep the expanded suite within its heap.
    maxHeapSize = '2g'
}
